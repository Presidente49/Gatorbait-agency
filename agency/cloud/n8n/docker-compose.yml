# n8n automation layer for Gator Bait Agency.
#
# Runs 24/7 on any VPS with Docker: n8n + PostgreSQL + Caddy (automatic HTTPS).
#
#   1. cp .env.example .env        # fill in REAL values on the server — never commit .env
#   2. docker compose up -d
#   3. Open https://n8n.example.com (your N8N_HOST value) and create the owner account.
#   4. Import starter workflows from ./workflows/ and connect each node's credentials.
#
# See README.md for backup, restore, and ops notes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - n8n-net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # REQUIRED: generate once with `openssl rand -hex 32`, back up in a
      # password manager. LOSING IT ORPHANS ALL STORED CREDENTIALS — they
      # cannot be decrypted or recovered without it.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Placeholder domain — must match the public URL Caddy serves.
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.example.com/}
      # Placeholder timezone — change to the operator's timezone.
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      TZ: ${GENERIC_TIMEZONE:-America/New_York}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Basic auth guard for the n8n editor UI (set real values in .env).
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?set N8N_BASIC_AUTH_USER in .env}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?set N8N_BASIC_AUTH_PASSWORD in .env}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      # Exposed on loopback only — Caddy is the public entry point.
      - "127.0.0.1:5678:5678"
    networks:
      - n8n-net

  caddy:
    image: caddy:2-alpine
    container_name: n8n-caddy
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Caddyfile is rendered from $N8N_HOST at startup so there is a single
    # source of truth (the .env value); no static Caddyfile is kept in the repo.
    command: >
      sh -c 'echo "$${N8N_HOST} {
        reverse_proxy n8n:5678
      }" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    networks:
      - n8n-net

networks:
  n8n-net:
    name: n8n-net
    driver: bridge

volumes:
  postgres_data:
    name: n8n-postgres-data
  n8n_data:
    name: n8n-data
  caddy_data:
    name: n8n-caddy-data
  caddy_config:
    name: n8n-caddy-config
